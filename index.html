<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SOUKAINA ❤️</title>
<style>body{margin:0;background:#100a10;color:#fff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:40px 20px}h1{text-align:center;font-size:72px}img{max-width:100%;border-radius:20px}audio{width:100%}.card{padding:25px;margin:25px 0;background:#ffffff0d;border:1px solid #ffffff18;border-radius:24px}button{padding:12px 20px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff12;color:#fff}</style></head>
<body><main><h1>SOUKAINA ❤️</h1><div class="card"><h2>لحظتنا الحلوة ❤️</h2><img src="assets/our-photo.png" alt="our photo"></div><div class="card"><h2>😂 ميمز</h2><img src="assets/meme1.jpg"><img src="assets/meme2.jpg"><img src="assets/meme3.jpg"><p>أحححح عليك 😂🌹</p><p>هاكي ورة بب 😂🌹</p><p>تزوجي بيا 😭🌹</p></div><div class="card"><h2>🎵 For You</h2><audio controls src="assets/song.mp3"></audio><p>For You ❤️</p></div><div class="card"><h2>🎂 كيكة تفاعلية</h2><div style="font-size:100px;text-align:center" id="cake">🎂🕯️🕯️🕯️</div><button onclick="blow()">أطفئي الشموع ✨</button><p id="cakeMsg"></p></div><div class="card"><h2>🎁 مفاجأة سرية</h2><button onclick="secret()">افتحي</button><p id="secretMsg"></p></div><div id="heart" style="position:fixed;inset:0;display:none;place-items:center;background:#050306ee;z-index:10"><div id="bigHeart" style="font-size:60px;transform:scale(.2);transition:transform 2s">❤️</div></div></main><script>let n=3;function blow(){if(n>0){n--;document.getElementById('cake').textContent='🎂'+('🕯️'.repeat(n));if(n===0)document.getElementById('cakeMsg').textContent='🎉 كل عام وأنتِ بخير SOUKAINA ❤️'}}function secret(){document.getElementById('secretMsg').textContent='هذه الرسالة السرية لكِ: أتمنى لكِ أجمل الأيام وأحلى الضحكات ❤️'}const audio=document.querySelector('audio');audio.addEventListener('ended',()=>{const h=document.getElementById('heart');h.style.display='grid';setTimeout(()=>{document.getElementById('bigHeart').style.transform='scale(5)'},50);setTimeout(()=>{h.innerHTML='<div style="font-size:60px;animation:pop .9s forwards">💗✨💖✨💕</div><style>@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(3);opacity:1}}</style>'},2100)});</script></body></html>
